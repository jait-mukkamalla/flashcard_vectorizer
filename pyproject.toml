[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flashcard-vectorizer"
version = "0.1.0"
description = "Local-first study tool: import Anki decks, vectorize the cards, search them semantically."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
fixtures = ["anki"]

[project.scripts]
flashcard-vectorizer = "flashcard_vectorizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flashcard_vectorizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
