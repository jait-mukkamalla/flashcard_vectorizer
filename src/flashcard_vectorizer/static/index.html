<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcard Vectorizer</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #fafaf8; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc;
    --accent: #2d5be3; --accent-soft: #e8eefc; --ok: #1f8a4c; --warn: #b26a00; --bad: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1e1e1c; --text: #ecebe6; --muted: #9a9992; --line: #33322e;
      --accent: #7c9cff; --accent-soft: #242b45; --ok: #5cc98a; --warn: #e0a24a; --bad: #ee7b6e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type=search] { flex: 1 1 260px; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line);
         border-radius: 8px; background: var(--bg); color: var(--text); }
  select, button { padding: 9px 12px; font-size: 14px; border-radius: 8px; border: 1px solid var(--line);
         background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .muted { color: var(--muted); font-size: 13px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .decks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .decks label { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; cursor: pointer; }
  .decks label:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }
  .decks input { display: none; }
  .card { border-top: 1px solid var(--line); padding: 12px 0; }
  .card:first-child { border-top: 0; }
  .q { font-weight: 600; white-space: pre-wrap; }
  .a { white-space: pre-wrap; margin-top: 4px; color: var(--muted); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tag { background: var(--accent-soft); border-radius: 4px; padding: 0 6px; }
  .err { color: var(--bad); }
  .toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
  input[type=number] { width: 64px; padding: 9px 8px; font-size: 14px; border: 1px solid var(--line);
         border-radius: 8px; background: var(--bg); color: var(--text); }
  .grow { flex: 1; min-width: 0; }
  .study-q { font-size: 20px; font-weight: 600; white-space: pre-wrap; margin: 18px 0 6px; }
  .study-a { font-size: 17px; white-space: pre-wrap; margin: 10px 0 14px; padding-top: 10px; border-top: 1px solid var(--line); }
  .grades { display: flex; gap: 8px; flex-wrap: wrap; }
  .grades button { min-width: 84px; }
  .grades button kbd { opacity: .55; font: inherit; font-size: 11px; margin-left: 4px; }
  .g1 { border-color: var(--bad); } .g2 { border-color: var(--warn); } .g3 { border-color: var(--ok); } .g4 { border-color: var(--accent); }
  .session { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  .session:first-child { border-top: 0; }
  .session .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>Flashcard Vectorizer <a href="/graph/" class="muted" style="font-weight:400;margin-left:10px" id="graphLink">Knowledge graph →</a></h1>

  <div class="panel">
    <div class="row">
      <button class="primary" id="importBtn">Import .apkg</button>
      <input type="file" id="file" accept=".apkg" hidden multiple>
      <span class="muted" id="status">Loading…</span>
      <label class="toggle" title="Schedule reviews with FSRS. Off = plain quiz, nothing is scheduled.">
        <input type="checkbox" id="fsrs"> Spaced repetition (FSRS)
      </label>
    </div>
    <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
    <div class="muted err" id="error" hidden></div>
  </div>

  <div class="panel">
    <form class="row" id="form">
      <input type="search" id="q" placeholder="Search your cards…" autofocus autocomplete="off">
      <select id="mode" title="Search mode">
        <option value="hybrid">Hybrid</option>
        <option value="dense">Semantic</option>
        <option value="keyword">Keyword</option>
      </select>
      <button class="primary" type="submit">Search</button>
    </form>
    <div class="row" style="margin-top:10px">
      <button id="quizBtn" title="Build a study session from the query above (or from the selected decks if it is empty)">Quiz me</button>
      <label class="muted">cards <input type="number" id="size" value="20" min="1" max="100"></label>
      <label class="toggle muted" id="dueWrap" hidden><input type="checkbox" id="dueOnly"> due &amp; new only</label>
      <span class="muted err" id="quizError"></span>
    </div>
    <div class="decks" id="decks"></div>
  </div>

  <div class="panel" id="study" hidden>
    <div class="row">
      <strong id="studyTitle" class="grow"></strong>
      <span class="muted" id="studyProgress"></span>
      <button id="endBtn">Close</button>
    </div>
    <div class="study-q" id="studyQ"></div>
    <div class="muted" id="studySched"></div>
    <div id="studyReveal" style="margin-top:12px">
      <button class="primary" id="showBtn">Show answer</button> <span class="muted">or press space</span>
    </div>
    <div id="studyAnswer" hidden>
      <div class="study-a" id="studyA"></div>
      <div class="grades" id="grades"></div>
    </div>
    <div id="studyDone" hidden>
      <div class="study-a" id="studySummary"></div>
    </div>
  </div>

  <div class="panel" id="sessionsPanel" hidden>
    <div class="muted" style="margin-bottom:4px">Unfinished sessions</div>
    <div id="sessions"></div>
  </div>

  <div class="panel" id="resultsPanel" hidden>
    <div class="muted" id="summary"></div>
    <div id="results"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let busy = false, lastJobKey = '', fsrsOn = true, sess = null, statusTimer = null;
const JSON_HEADERS = { 'Content-Type': 'application/json' };

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function refreshStatus() {
  clearTimeout(statusTimer);  // callers refresh on demand; keep a single polling loop
  try {
    const s = await api('/api/status');
    const j = s.job, parts = [`${s.cards.toLocaleString()} cards in ${s.decks} deck${s.decks === 1 ? '' : 's'}`];
    let pct = null;
    if (j.phase === 'importing') parts.push(`importing ${j.import.file}… ${j.import.cards.toLocaleString()} cards`);
    else if (j.phase === 'embedding' || (s.pending > 0 && j.phase === 'queued')) {
      pct = s.cards ? (s.embedded / s.cards) * 100 : 0;
      parts.push(`embedding ${s.embedded.toLocaleString()} / ${s.cards.toLocaleString()} (keyword search already works)`);
    } else if (j.phase === 'graphing') {
      const g = j.graph;
      parts.push(`building the knowledge graph${g && g.total ? ` (${g.stage} ${Math.round(g.done / g.total * 100)}%)` : ''}`);
    } else if (s.pending > 0) parts.push(`${s.pending.toLocaleString()} cards not yet embedded`);
    else if (s.cards) parts.push(s.graph.ready ? `all embedded · ${s.graph.clusters} clusters` : 'all embedded');
    fsrsOn = s.fsrs;
    if (s.fsrs && s.cards) parts.push(`${s.due.toLocaleString()} due · ${s.new.toLocaleString()} new`);
    if (j.import && j.import.done && j.import.reviews) parts.push(`${j.import.reviews.toLocaleString()} reviews imported`);
    $('fsrs').checked = s.fsrs;
    $('dueWrap').hidden = !s.fsrs;
    $('status').textContent = parts.join(' · ');
    $('barWrap').hidden = pct === null;
    if (pct !== null) $('bar').style.width = pct + '%';
    $('error').hidden = !j.error;
    $('error').textContent = j.error || '';
    const key = s.cards + ':' + s.decks;
    if (key !== lastJobKey) { lastJobKey = key; refreshDecks(); }
    statusTimer = setTimeout(refreshStatus, ['importing', 'embedding', 'graphing', 'queued'].includes(j.phase) ? 1000 : 4000);
  } catch (e) {
    $('status').textContent = 'Server unreachable';
    statusTimer = setTimeout(refreshStatus, 4000);
  }
}

async function refreshDecks() {
  const checked = new Set([...document.querySelectorAll('#decks input:checked')].map(i => i.value));
  const box = $('decks');
  box.replaceChildren();
  for (const d of await api('/api/decks')) {
    const label = el('label'), input = el('input');
    input.type = 'checkbox'; input.value = d.id; input.checked = checked.has(String(d.id));
    label.append(input, `${d.name} (${d.cards.toLocaleString()})`);
    box.append(label);
  }
}

$('importBtn').onclick = () => $('file').click();
$('file').onchange = async e => {
  for (const f of e.target.files) {
    const body = new FormData(); body.append('file', f);
    try { await api('/api/import', { method: 'POST', body }); }
    catch (err) { $('error').hidden = false; $('error').textContent = `${f.name}: ${err.message}`; }
  }
  e.target.value = '';
  refreshStatus();
};

$('form').onsubmit = async e => {
  e.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;
  const params = new URLSearchParams({ q, mode: $('mode').value, limit: 30 });
  document.querySelectorAll('#decks input:checked').forEach(i => params.append('deck', i.value));
  try {
    const r = await api('/api/search?' + params);
    render(r);
  } catch (err) {
    $('resultsPanel').hidden = false;
    $('summary').textContent = 'Search failed: ' + err.message;
    $('results').replaceChildren();
  }
};

function render(r) {
  $('resultsPanel').hidden = false;
  const t = r.timings, note = (r.mode !== 'keyword' && !r.dense_ready) ? ' · no vectors yet, showing keyword matches only' : '';
  $('summary').textContent = `${r.results.length} results in ${t.total_ms.toFixed(0)} ms` +
    (t.embed_ms !== undefined ? ` (embed ${t.embed_ms.toFixed(0)}, vector ${t.dense_ms.toFixed(0)}` +
      (t.keyword_ms !== undefined ? `, keyword ${t.keyword_ms.toFixed(0)}` : '') + ')' : '') + note;
  const out = $('results');
  out.replaceChildren();
  for (const c of r.results) {
    const card = el('div', 'card');
    card.append(el('div', 'q', c.question), el('div', 'a', c.answer));
    const meta = el('div', 'meta');
    meta.append(el('span', '', c.deck));
    if (c.dense_score != null) meta.append(el('span', '', `similarity ${c.dense_score.toFixed(3)}`));
    if (c.keyword_rank != null) meta.append(el('span', '', `keyword #${c.keyword_rank}`));
    for (const tag of c.tags.split(' ').filter(Boolean)) meta.append(el('span', 'tag', tag));
    card.append(meta);
    out.append(card);
  }
}

$('fsrs').onchange = async e => {
  try {
    await api('/api/settings', { method: 'PUT', headers: JSON_HEADERS, body: JSON.stringify({ fsrs: e.target.checked }) });
  } catch (err) { $('error').hidden = false; $('error').textContent = err.message; }
  await refreshStatus();
  if (sess) nextCard();  // the card shown now carries (or drops) its schedule
};

// ---- study sessions -------------------------------------------------------------------
$('quizBtn').onclick = async () => {
  $('quizError').textContent = '';
  const decks = [...document.querySelectorAll('#decks input:checked')].map(i => +i.value);
  const body = {
    query: $('q').value.trim() || null, mode: $('mode').value, decks: decks.length ? decks : null,
    size: Math.min(100, Math.max(1, +$('size').value || 20)),
    scope: fsrsOn && $('dueOnly').checked ? 'due' : 'all',
  };
  try {
    const s = await api('/api/sessions', { method: 'POST', headers: JSON_HEADERS, body: JSON.stringify(body) });
    await openSession(s.id);
  } catch (err) { $('quizError').textContent = err.message; }
};

async function openSession(id) {
  sess = { id, card: null, summary: null, shownAt: 0, revealed: false };
  $('study').hidden = false;
  $('study').scrollIntoView({ block: 'nearest' });
  await nextCard();
  refreshSessions();
}

async function nextCard() {
  const r = await api(`/api/sessions/${sess.id}/next`);
  sess.card = r.card; sess.summary = r.session; sess.revealed = false; sess.shownAt = Date.now();
  renderCard();
}

function renderCard() {
  const { card, summary } = sess;
  $('studyTitle').textContent = summary.title;
  $('studyProgress').textContent = `${summary.answered} answered · ${summary.remaining} to go`;
  $('studyReveal').hidden = !card || sess.revealed;
  $('studyAnswer').hidden = !card || !sess.revealed;
  $('studyDone').hidden = !!card;
  $('studyQ').textContent = card ? card.question : '';
  $('studySched').textContent = '';
  if (card) {
    $('studyA').textContent = card.answer;
    const sc = card.schedule;
    $('studySched').textContent = [card.deck, sc && (sc.state === 'new' ? 'new card' :
      `${sc.state} · recall ${(sc.retrievability * 100).toFixed(0)}%`)].filter(Boolean).join(' · ');
    const grades = fsrsOn ? [[1, 'Again'], [2, 'Hard'], [3, 'Good'], [4, 'Easy']] : [[1, 'Missed'], [3, 'Got it']];
    $('grades').replaceChildren(...grades.map(([rating, label], i) => {
      const b = el('button', 'g' + rating, label);
      b.append(el('kbd', '', String(i + 1)));
      b.onclick = () => grade(rating);
      return b;
    }));
  } else {
    const rate = summary.recall_rate === null ? '' : ` Recalled ${(summary.recall_rate * 100).toFixed(0)}% of answers.`;
    $('studySummary').textContent = `Session finished: ${summary.answered} answers.${rate}`;
  }
}

function reveal() {
  if (!sess || !sess.card || sess.revealed) return;
  sess.revealed = true;
  renderCard();
}

async function grade(rating) {
  if (!sess || !sess.card || !sess.revealed) return;
  const body = { card_id: sess.card.id, rating, duration_ms: Date.now() - sess.shownAt };
  sess.revealed = false;  // ignore double presses while the request is in flight
  try {
    await api(`/api/sessions/${sess.id}/answer`, { method: 'POST', headers: JSON_HEADERS, body: JSON.stringify(body) });
    await nextCard();
    refreshStatus();
  } catch (err) { $('quizError').textContent = err.message; sess.revealed = true; }
}

$('showBtn').onclick = reveal;
$('endBtn').onclick = () => { sess = null; $('study').hidden = true; refreshSessions(); };
document.addEventListener('keydown', e => {
  if (!sess || e.target.closest('input, select, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ' || e.key === 'Enter') {
    if (e.target.closest('button')) return;  // a focused button handles its own activation
    e.preventDefault(); reveal();
  } else if (sess.revealed && sess.card && /^[1-4]$/.test(e.key)) {
    const rating = (fsrsOn ? [1, 2, 3, 4] : [1, 3])[+e.key - 1];
    if (rating) grade(rating);
  }
});

async function refreshSessions() {
  try {
    const open = (await api('/api/sessions')).filter(s => s.remaining > 0 && !(sess && sess.id === s.id));
    $('sessionsPanel').hidden = open.length === 0;
    $('sessions').replaceChildren(...open.map(s => {
      const row = el('div', 'session');
      row.append(el('span', 'grow', s.title), el('span', 'muted', `${s.remaining} left`));
      const resume = el('button', '', 'Resume'); resume.onclick = () => openSession(s.id);
      const drop = el('button', '', 'Discard');
      drop.onclick = async () => { await api(`/api/sessions/${s.id}`, { method: 'DELETE' }); refreshSessions(); };
      row.append(resume, drop);
      return row;
    }));
  } catch (e) { /* the status line already reports an unreachable server */ }
}

// The knowledge graph starts a session and sends us here as /#session=<id>.
const jump = /^#session=(\d+)$/.exec(location.hash);
const ready = refreshStatus();
if (jump) {
  history.replaceState(null, '', location.pathname);
  ready.then(() => openSession(+jump[1])).catch(err => { $('quizError').textContent = err.message; });
}
refreshSessions();
</script>
</body>
</html>
